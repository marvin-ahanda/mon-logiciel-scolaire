<form class="row g-2 mb-3 no-print" method="get">
  <div class="col-md-5"><select class="form-select" name="classe" required aria-label="Classe"><option value="">Classe…</option>
    {% for c in classes %}<option value="{{ c.pk }}" {% if c.pk|stringformat:"s" == c_id %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></div>
  <div class="col-md-4"><select class="form-select" name="periode" required aria-label="Période"><option value="">Période…</option>
    <optgroup label="Séquences">{% for p in periodes %}{% if p.type == "sequence" %}<option value="{{ p.code }}" {% if p.code == p_code %}selected{% endif %}>{{ p.libelle }}</option>{% endif %}{% endfor %}</optgroup>
    <optgroup label="Trimestres">{% for p in periodes %}{% if p.type == "trimestre" %}<option value="{{ p.code }}" {% if p.code == p_code %}selected{% endif %}>{{ p.libelle }}</option>{% endif %}{% endfor %}</optgroup>
    <optgroup label="Année">{% for p in periodes %}{% if p.type == "annee" %}<option value="{{ p.code }}" {% if p.code == p_code %}selected{% endif %}>Bilan annuel</option>{% endif %}{% endfor %}</optgroup>
  </select></div>
  <div class="col-md-3"><button class="btn btn-outline-primary w-100">Afficher</button></div>
</form>
