{% extends "base.html" %}
{% block titre %}Connexion{% endblock %}
{% block contenu %}
<div class="row justify-content-center mt-5">
  <div class="col-sm-8 col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-1 text-primary">OtourixSchool</h1>
        <p class="text-muted mb-4">Gestion des notes scolaires</p>
        {% if form.errors %}<div class="alert alert-danger">Identifiant ou mot de passe incorrect.</div>{% endif %}
        <form method="post">{% csrf_token %}
          <div class="mb-3"><label class="form-label" for="id_username">Identifiant</label>
            <input class="form-control" name="username" id="id_username" autofocus required autocomplete="username"></div>
          <div class="mb-4"><label class="form-label" for="id_password">Mot de passe</label>
            <input class="form-control" type="password" name="password" id="id_password" required autocomplete="current-password"></div>
          <input type="hidden" name="next" value="{{ next }}">
          <button class="btn btn-primary w-100">Se connecter</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
