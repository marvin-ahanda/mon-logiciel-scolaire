# NexIASchool sur Netlify (plan Free) : site statique (Vite) + une fonction planifiée légère.
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Serveur MCP et OAuth (Supabase Edge Function « mcp »), servis depuis le domaine du site
[[redirects]]
  from = "/mcp"
  to = "https://woxdqzocwqnrpfmxlsbq.supabase.co/functions/v1/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-protected-resource"
  to = "https://woxdqzocwqnrpfmxlsbq.supabase.co/functions/v1/mcp/.well-known/oauth-protected-resource"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-protected-resource/*"
  to = "https://woxdqzocwqnrpfmxlsbq.supabase.co/functions/v1/mcp/.well-known/oauth-protected-resource"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-authorization-server"
  to = "https://woxdqzocwqnrpfmxlsbq.supabase.co/functions/v1/mcp/.well-known/oauth-authorization-server"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-authorization-server/*"
  to = "https://woxdqzocwqnrpfmxlsbq.supabase.co/functions/v1/mcp/.well-known/oauth-authorization-server"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/openid-configuration"
  to = "https://woxdqzocwqnrpfmxlsbq.supabase.co/functions/v1/mcp/.well-known/oauth-authorization-server"
  status = 200
  force = true

[[redirects]]
  from = "/oauth/register"
  to = "https://woxdqzocwqnrpfmxlsbq.supabase.co/functions/v1/mcp/oauth/register"
  status = 200
  force = true

[[redirects]]
  from = "/oauth/token"
  to = "https://woxdqzocwqnrpfmxlsbq.supabase.co/functions/v1/mcp/oauth/token"
  status = 200
  force = true

# Application monopage : toutes les adresses servent index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
