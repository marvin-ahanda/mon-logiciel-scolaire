# Worker planifié « nexiaschool-maintien » : ping quotidien du projet Supabase (plan Free), pour éviter sa mise en pause.
# Déploiement : « npx wrangler deploy --config workers/maintien/wrangler.toml » (ou le workflow GitHub cloudflare.yml).
name = "nexiaschool-maintien"
main = "index.js"
compatibility_date = "2025-09-01"
workers_dev = false

[triggers]
# Toutes les heures à la minute 17 : ping Supabase, automatisations personnelles dues, courriers programmés et relances de
# paiement (relances une seule fois par jour, pas avant 6 h à Douala) ; à 05:17 UTC (06:17 à Douala) : rappels de fin d'abonnement.
crons = ["17 * * * *"]

# Valeurs publiques (déjà présentes dans le code envoyé au navigateur)
[vars]
SUPABASE_URL = "https://woxdqzocwqnrpfmxlsbq.supabase.co"
SUPABASE_CLE_PUBLIQUE = "sb_publishable_wfw2lxWPuDSEYWDvIh2BPg_BhO55ZfX"
